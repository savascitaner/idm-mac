name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build and package
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
          BUILD: ${{ github.run_number }}
        run: ./Packaging/package.sh

      - name: Smoke test (launch app, download through the native host)
        run: python3 Packaging/smoke_test.py "dist/IDM Mac.app"

      - uses: actions/upload-artifact@v4
        with:
          name: IDM-Mac
          path: dist/IDM-Mac.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: dist/screenshot.png
          if-no-files-found: ignore

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/IDM-Mac.dmg --prerelease --target "$GITHUB_SHA" \
            --title "Son sürüm (${GITHUB_SHA::7})" \
            --notes "main dalından otomatik üretilen son sürüm. Kurulum için DMG içindeki BENİ OKU dosyasına bak."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/IDM-Mac.dmg --title "IDM Mac $GITHUB_REF_NAME" --generate-notes
