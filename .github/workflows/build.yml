name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time; a newer push replaces an older build so two runs
# never replace the "latest" release at the same moment.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          swift --version
          xcodebuild -version

      # Signing only runs when the repository secrets exist; without them the build stays ad-hoc signed.
      - name: Import signing certificates
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          printf '%s' "$MACOS_CERT_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "p12: $(wc -c < "$RUNNER_TEMP/app.p12") bayt, secret uzunluğu ${#MACOS_CERT_P12} karakter, ilk bayt: $(head -c1 "$RUNNER_TEMP/app.p12" | xxd -p)"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          if [ -n "$MACOS_INSTALLER_P12" ]; then
            echo "$MACOS_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
            security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "${MACOS_INSTALLER_PASSWORD:-$MACOS_CERT_PASSWORD}" -T /usr/bin/productsign -T /usr/bin/productbuild
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          rm -f "$RUNNER_TEMP"/*.p12
          IDS="$(security find-identity -v "$KC")"
          echo "$IDS"
          APP_ID="$(echo "$IDS" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          INST_ID="$(echo "$IDS" | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -1)"
          [ -n "$APP_ID" ] || { echo "Developer ID Application sertifikası bulunamadı"; exit 1; }
          echo "SIGN_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          [ -n "$INST_ID" ] && echo "INSTALLER_ID=$INST_ID" >> "$GITHUB_ENV"
          exit 0

      - name: Build and package
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
          BUILD: ${{ github.run_number }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          EXTENSION_PEM: ${{ secrets.EXTENSION_PEM }}
        run: ./Packaging/package.sh

      - name: Smoke test (launch app, download through the native host)
        run: python3 Packaging/smoke_test.py "dist/MDM.app"

      # The release is the real delivery; a full Actions storage quota must not fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MDM
          path: |
            dist/MDM.dmg
            dist/MDM.pkg
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: screenshot
          path: dist/screenshot.png
          if-no-files-found: ignore

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The "latest" release is never deleted: its files are replaced in place, so the download
          # links keep working even when a step fails half way.
          # An old run that is re-run must not put an older build over a newer one.
          HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha || true)"
          if [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Bu derleme main'in son hali değil ($GITHUB_SHA, son: $HEAD_SHA); yayınlanmadı."
            exit 0
          fi
          FILES="dist/MDM.dmg"
          [ -f dist/MDM.pkg ] && FILES="$FILES dist/MDM.pkg"
          [ -f dist/screenshot.png ] && FILES="$FILES dist/screenshot.png"
          [ -f dist/shots.zip ] && FILES="$FILES dist/shots.zip"
          TITLE="Son sürüm (${GITHUB_SHA::7})"
          NOTES="main dalından otomatik üretilen son sürüm. Kurulum için MDM.pkg dosyasını indirip çift tıkla.

          commit: ${GITHUB_SHA}"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest $FILES --clobber
            gh release edit latest --title "$TITLE" --notes "$NOTES" --prerelease
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create latest $FILES --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      # The source repository is private; the app and its updater read this public one.
      - name: Publish to the public releases repository
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "RELEASES_TOKEN yok, public sürüm deposuna yayınlanmadı"; exit 0; }
          PUB=savascitaner/mdm-releases
          gh release delete latest --yes --cleanup-tag -R "$PUB" || true
          FILES="dist/MDM.dmg"
          [ -f dist/MDM.pkg ] && FILES="$FILES dist/MDM.pkg"
          [ -f dist/shots.zip ] && FILES="$FILES dist/shots.zip"
          gh release create latest $FILES -R "$PUB" --prerelease \
            --title "Son sürüm (${GITHUB_SHA::7})" \
            --notes "MDM son sürüm. Kurulum için MDM.pkg dosyasını indirip çift tıkla.

          commit: ${GITHUB_SHA}"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MDM.dmg dist/MDM.pkg --title "MDM $GITHUB_REF_NAME" --generate-notes
