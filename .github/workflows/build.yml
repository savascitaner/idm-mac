name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time; a newer push replaces an older build so two runs
# never replace the "latest" release at the same moment.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build and package
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
          BUILD: ${{ github.run_number }}
        run: ./Packaging/package.sh

      - name: Smoke test (launch app, download through the native host)
        run: python3 Packaging/smoke_test.py "dist/MDM.app"

      - uses: actions/upload-artifact@v4
        with:
          name: MDM
          path: |
            dist/MDM.dmg
            dist/MDM.pkg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: dist/screenshot.png
          if-no-files-found: ignore

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          FILES="dist/MDM.dmg dist/MDM.pkg"
          [ -f dist/screenshot.png ] && FILES="$FILES dist/screenshot.png"
          gh release create latest $FILES --prerelease --target "$GITHUB_SHA" \
            --title "Son sürüm (${GITHUB_SHA::7})" \
            --notes "main dalından otomatik üretilen son sürüm. Kurulum için DMG içindeki BENİ OKU dosyasına bak."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MDM.dmg dist/MDM.pkg --title "MDM $GITHUB_REF_NAME" --generate-notes
